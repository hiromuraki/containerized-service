---
apiVersion: v1
kind: ConfigMap
metadata:
    name: drawio-env
data:
    TZ: "Asia/Shanghai"

---
apiVersion: v1
kind: Pod
metadata:
    name: drawio
    labels:
        app: drawio
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: drawio
          # https://hub.docker.com/r/jgraph/drawio
          image: jgraph/drawio:32.6.10
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false

          envFrom:
              - configMapRef:
                    name: drawio-env
          ports:
              - containerPort: 8080

          resources:
              requests:
                  memory: 64Mi
              limits:
                  memory: 512Mi
