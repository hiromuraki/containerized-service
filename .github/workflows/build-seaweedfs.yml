name: Build and Push SeaweedFS Image

on:
    push:
        branches: ["main"]
        paths:
            - "oci-image/seaweedfs/**"
            - ".github/workflows/build-seaweedfs.yml"
    pull_request:
        branches: ["main"]
        paths:
            - "oci-image/seaweedfs/**"
            - ".github/workflows/build-seaweedfs.yml"
    workflow_dispatch:

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # 登录到 GHCR
            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 登录到阿里云 ACR
            - name: Log in to ACR
              uses: docker/login-action@v3
              with:
                  registry: ${{ secrets.ALIYUN_REGISTRY }}
                  username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                  password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            # 自动提取 Metadata (生成标签和注释)
            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: |
                      ghcr.io/${{ github.repository }}/seaweedfs
                      ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/seaweedfs
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short

            # 构建并推送镜像
            - name: Build and push SeaweedFS image
              uses: docker/build-push-action@v5
              with:
                  context: ./oci-image/seaweedfs
                  file: ./oci-image/seaweedfs/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
