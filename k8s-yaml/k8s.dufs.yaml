---
apiVersion: v1
kind: ConfigMap
metadata:
    name: dufs-env
data:
    DUFS_SERVE_PATH: "/data"
    DUFS_BIND: "0.0.0.0"
    DUFS_PORT: "5000"
    DUFS_ALLOW_UPLOAD: "true"
    DUFS_ALLOW_DELETE: "true"
    DUFS_ALLOW_SEARCH: "true"
    DUFS_ALLOW_ARCHIVE: "true"

---
apiVersion: v1
kind: Secret
metadata:
    name: dufs-secrets
type: Opaque
stringData:
    # 格式是 "用户名:密码@路径:权限"；密码里不能出现 @ 和 :，否则规则会被拆错
    DUFS_AUTH: "dufs:your_safe_password@/:rw|rime:another_password@/rime:rw"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: dufs-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 10Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: dufs
    labels:
        app: dufs
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: dufs
          # https://hub.docker.com/r/sigoden/dufs/tags
          image: docker.io/sigoden/dufs:v0.47.0
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL

          envFrom:
              - configMapRef:
                    name: dufs-env
              - secretRef:
                    name: dufs-secrets
          ports:
              - name: http
                containerPort: 5000

          resources:
              requests:
                  memory: 32Mi
              limits:
                  memory: 64Mi

          # dufs 镜像是 scratch（只有 /bin/dufs，没有 shell / curl / nc）：
          # podman kube play 会把 httpGet 探针翻译成容器内 curl、tcpSocket 翻译成 nc，
          # 所以这里不放探针。真跑在 kubelet 上时可以加（健康端点不需要认证）：
          #   httpGet: { path: /__dufs__/health, port: http }
          volumeMounts:
              - name: data
                mountPath: /data
    volumes:
        - name: data
          persistentVolumeClaim:
              claimName: dufs-data
