---
apiVersion: v1
kind: ConfigMap
metadata:
    name: plantuml-env
data:
    TZ: "Asia/Shanghai"

---
apiVersion: v1
kind: Pod
metadata:
    name: plantuml
    labels:
        app: plantuml
spec:
    restartPolicy: Always
    containers:
        - name: plantuml
          image: docker.io/plantuml/plantuml-server:jetty
          envFrom:
              - configMapRef:
                    name: plantuml-env
          ports:
              - containerPort: 8080
