---
apiVersion: v1
kind: ConfigMap
metadata:
    name: vaultwarden-env
data:
    TZ: "Asia/Shanghai"
    DOMAIN: "https://vw.daveny.top"
    SIGNUPS_ALLOWED: "false"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: vaultwarden-data
spec:
    accessModes:
        - ReadWriteOnce
    resources:
        requests:
            storage: 5Gi

---
apiVersion: v1
kind: Pod
metadata:
    name: vaultwarden
    labels:
        app: vaultwarden
spec:
    restartPolicy: Always
    terminationGracePeriodSeconds: 30

    containers:
        - name: vaultwarden
          # https://hub.docker.com/r/vaultwarden/server/tags
          image: vaultwarden/server:1.37.5-alpine
          imagePullPolicy: Always

          securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                  drop:
                      - ALL
                  add:
                      - NET_BIND_SERVICE

          envFrom:
              - configMapRef:
                    name: vaultwarden-env

          ports:
              - containerPort: 80

          resources:
              requests:
                  memory: 32Mi
              limits:
                  memory: 128Mi

          volumeMounts:
              - name: vaultwarden-data
                mountPath: /data/
    volumes:
        - name: vaultwarden-data
          persistentVolumeClaim:
              claimName: vaultwarden-data
